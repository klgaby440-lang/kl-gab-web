<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Llink OCR - Apprentissage</title>
</head>
<body style="background: #111; color: white; font-family: sans-serif; padding: 20px;">

    <h2>1. La Structure (HTML)</h2>
    <input type="file" id="selecteurFichier" accept="image/*">
    <br><br>
    <button id="boutonAction" style="padding: 10px 20px; cursor: pointer;">
        SCANNER L'IMAGE
    </button>

    <hr>

    <h2>2. État du système</h2>
    <div id="statut" style="color: gold;">Prêt. Sélectionnez une image.</div>

    <hr>

    <h2>3. Résultat de l'IA</h2>
    <div id="resultat" style="background: #222; padding: 15px; border-left: 4px solid gold;">
        Le texte apparaîtra ici...
    </div>

    <script>
        // --- LE CERVEAU (JavaScript) ---

        // Étape A : On crée des variables pour "attraper" nos éléments HTML
        const input = document.getElementById('selecteurFichier');
        const bouton = document.getElementById('boutonAction');
        const statut = document.getElementById('statut');
        const resultat = document.getElementById('resultat');

        // Étape B : On définit la clé et l'adresse de l'IA
         // On sépare la clé pour éviter les robots de scan basiques sur GitHub
const p1 = "hf_upEJEWLPHPyrkFjVur";
const p2 = "CpJlsCvXlPNIaiZm";
const API_KEY = p1 + p2;

async function runOCR() {
    const fileInput = document.getElementById('imgFile'); // Vérifie que l'ID est bien imgFile
    const file = fileInput.files[0];
    const status = document.getElementById('status');
    const resDiv = document.getElementById('res');

    if (!file) {
        alert("Sélectionne une image d'abord !");
        return;
    }

    status.innerText = "⏳ Envoi en cours...";
    resDiv.innerText = "";

    try {
        const response = await fetch("https://api-inference.huggingface.co/models/Qwen/Qwen2.5-VL-72B-Instruct", {
            method: "POST",
            headers: { 
                "Authorization": `Bearer ${API_KEY}`
                // Note : On NE met PAS de Content-Type, le navigateur le fait seul pour les fichiers
            },
            body: file
        });

        // 1. On vérifie si le serveur a répondu (même si c'est une erreur)
        const data = await response.json();

        if (!response.ok) {
            // Si c'est une erreur 401, ta clé est morte ou mal copiée
            if (response.status === 401) {
                status.innerText = "❌ Erreur 401 : Jeton invalide ou expiré.";
            } 
            // Si le modèle charge
            else if (data.error && data.error.includes("loading")) {
                status.innerText = "⏳ Modèle en cours de démarrage... Réessaie dans 15 secondes.";
            } 
            else {
                status.innerText = "❌ Erreur API : " + (data.error || response.statusText);
            }
            return;
        }

        // 2. Si ça marche, on traite le résultat
        // Qwen-VL renvoie souvent un tableau ou un objet direct
        const text = data[0]?.generated_text || data.generated_text || "Aucun texte détecté.";
        resDiv.innerText = text;
        status.innerText = "✅ Succès !";

    } catch (e) {
        // 3. Erreur de connexion (CORS, Internet coupé, etc.)
        status.innerText = "❌ Erreur de connexion (Vérifie ta console F12)";
        console.error("ERREUR COMPLETE :", e);
    }
}
    </script>
</body>
</html>
