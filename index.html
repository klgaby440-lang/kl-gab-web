<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOW LAB | IA TRADUCTION & VOIX</title>
    <style>
        :root { 
            --primary: #007bff; 
            --secondary: #6c757d;
            --bg: #F4F7F6; 
            --card: white; 
        }
        body { background-color: var(--bg); padding: 20px; font-family: 'Segoe UI', sans-serif; text-align: center; color: #333; }
        main { background-color: var(--card); padding: 30px; width: 95%; max-width: 600px; margin: 0 auto; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .menu { display: flex; justify-content: space-between; margin-bottom: 15px; gap: 10px; }
        select { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; background: white; }
        textarea { width: 100%; padding: 15px; height: 160px; margin: 15px 0; border: 1px solid #eee; border-radius: 8px; box-sizing: border-box; font-size: 16px; resize: none; outline: none; }
        .actions { display: flex; gap: 10px; }
        button { flex: 2; background-color: var(--primary); color: white; padding: 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-audio { flex: 1; background-color: var(--secondary); font-size: 20px; }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #sortie { margin-top: 25px; padding: 20px; background: #f8f8f8; border-radius: 8px; border-left: 5px solid var(--primary); text-align: left; min-height: 40px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <header>
        <h1>FLOW LAB</h1>
        <p>SYSTÈME DE TRADUCTION & SYNTHÈSE VOCALE</p>
    </header>

    <main>
        <div class="menu">
            <select id="langue_src">
                <option value="Français">Français</option>
                <option value="Anglais">Anglais</option>
                <option value="Swahili">Swahili</option>
                <option value="Lingala">Lingala</option>
            </select>
            <select id="langue_trgt">
                <option value="Swahili">Swahili</option>
                <option value="Lingala">Lingala</option>
                <option value="Tshiluba">Tshiluba</option>
                <option value="Kikongo">Kikongo</option>
                <option value="Mashi">Mashi</option>
                <option value="Anglais">Anglais</option>
                <option value="Mandarin">Mandarin</option>
                <option value="Portugais">Portugais</option>
            </select>
        </div>
        <textarea id="entree" placeholder="Entrer le texte à traduire..."></textarea>
        <div class="actions">
            <button id="bouton">TRADUIRE</button>
            <button id="btn_ecouter" class="btn-audio" title="Écouter la traduction">🔊</button>
        </div>
        <div id="sortie">La traduction s'affichera ici...</div>
    </main>

    <script>
        // Fragmentation de la clé d'API
        const p1 = "hf_upEJEWLPHPyrkFjVur";
        const p2 = "CpJlsCvXlPNIaiZm"; 
        const API_TOKEN = p1 + p2;

        // Dictionnaire de routage pour les modèles vocaux (ISO codes)
        const MODELES_TTS = {
            "Swahili": "facebook/mms-tts-swh",
            "Lingala": "facebook/mms-tts-lin",
            "Tshiluba": "facebook/mms-tts-lua",
            "Kikongo": "facebook/mms-tts-kon",
            "Français": "facebook/mms-tts-fra",
            "Anglais": "facebook/mms-tts-eng",
            "Mandarin": "facebook/mms-tts-cmn",
            "Portugais": "facebook/mms-tts-por",
            "Mashi": "facebook/mms-tts-swh" // Fallback pour le Mashi
        };

        const btnTraduire = document.getElementById("bouton");
        const btnEcouter = document.getElementById("btn_ecouter");
        const sortieDiv = document.getElementById("sortie");

        // 1. Traduction via DeepSeek
        btnTraduire.addEventListener("click", async () => {
            const texte = document.getElementById("entree").value;
            const src = document.getElementById("langue_src").value;
            const trgt = document.getElementById("langue_trgt").value;

            if (!texte.trim()) return;
            
            btnTraduire.innerText = "CONNEXION EN COURS...";
            btnTraduire.disabled = true;

            const BASE_URL_TRANS = "https://router.huggingface.co/v1/chat/completions";
            const API_URL_TRANS = "https://corsproxy.io/?" + encodeURIComponent(BASE_URL_TRANS);

            try {
                const response = await fetch(API_URL_TRANS, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${API_TOKEN}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        model: "deepseek-ai/DeepSeek-V3",
                        messages: [
                            { role: "system", content: `Traducteur de ${src} vers ${trgt}. Fournir uniquement le texte traduit.` },
                            { role: "user", content: texte }
                        ],
                        max_tokens: 500
                    })
                });

                if (!response.ok) throw new Error("Erreur serveur API");
                const data = await response.json();
                sortieDiv.innerText = data.choices[0].message.content.trim();

            } catch (err) {
                sortieDiv.innerText = "Erreur de connexion. Vérifier le réseau.";
            } finally {
                btnTraduire.innerText = "TRADUIRE MAINTENANT";
                btnTraduire.disabled = false;
            }
        });

        // 2. Synthèse Vocale (TTS) avec routage dynamique
        btnEcouter.addEventListener("click", async () => {
            const texteATraduire = sortieDiv.innerText;
            const trgt = document.getElementById("langue_trgt").value;
            
            if (!texteATraduire || texteATraduire.includes("Erreur")) return;

            btnEcouter.innerText = "⏳";
            btnEcouter.disabled = true;
            
            // Sélection dynamique de l'URL du modèle en fonction de la langue
            const modeleCible = MODELES_TTS[trgt];
            const BASE_URL_TTS = `https://api-inference.huggingface.co/models/${modeleCible}`;
            const API_URL_TTS = "https://corsproxy.io/?" + encodeURIComponent(BASE_URL_TTS);

            try {
                const response = await fetch(API_URL_TTS, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${API_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ inputs: texteATraduire })
                });

                if (!response.ok) throw new Error("Erreur lors de la génération audio");

                const blob = await response.blob();
                const audio = new Audio(URL.createObjectURL(blob));
                audio.play();
                
            } catch (err) {
                console.error("Échec audio:", err);
                alert("Le modèle vocal pour cette langue est en cours de chargement, réessayer dans un instant.");
            } finally {
                btnEcouter.innerText = "🔊";
                btnEcouter.disabled = false;
            }
        });
    </script>
</body>
</html>
