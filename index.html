<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRADUCTION | NLLB-200</title>
    <style>
        :root { --primary: #28a745; --bg: #F9F9F9; --card: white; }
        body { background-color: var(--bg); padding: 20px; font-family: sans-serif; text-align: center; color: #333; }
        main { background-color: var(--card); padding: 30px; width: 95%; max-width: 600px; margin: 0 auto; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        textarea { width: 100%; padding: 15px; height: 160px; margin: 15px 0; border: 1px solid #eee; border-radius: 8px; box-sizing: border-box; font-size: 16px; resize: none; }
        button { background-color: var(--primary); color: white; width: 100%; padding: 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #sortie { margin-top: 25px; padding: 20px; background: #f8f8f8; border-radius: 8px; font-size: 1.1em; text-align: left; min-height: 40px; border-left: 5px solid var(--primary); }
    </style>
</head>
<body>
    <header>
        <h1>Modèle : NLLB-200</h1>
        <p>distilled-600M</p>
    </header>
    <main>
        <textarea id="entree" placeholder="Texte en français à traduire..."></textarea>
        <button id="bouton">LANCER LA TRADUCTION</button>
        <div id="sortie">La traduction s'affichera ici...</div>
    </main>

    <script>
        const p1 = "hf_upEJEWLPHPyrk";
        const p2 = "FjVurCpJlsCvXlPNIaiZm";
        const API_TOKEN = p1+p2; 
        const API_URL = "https://router.huggingface.co/hf-inference/models/facebook/nllb-200-distilled-600M";

        document.getElementById("bouton").addEventListener("click", async () => {
            const input = document.getElementById("entree").value;
            const output = document.getElementById("sortie");
            if (!input.trim()) return;

            output.innerText = "Traduction en cours...";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "inputs": input,
                        "parameters": {
                            "src_lang": "fra_Latn",
                            "tgt_lang": "swh_Latn"
                        }
                    })
                });

                const data = await response.json();
                if (data[0] && data[0].translation_text) {
                    output.innerText = data[0].translation_text;
                } else {
                    output.innerText = "Erreur : Vérifier le quota ou le jeton.";
                }
            } catch (error) {
                output.innerText = "Erreur de connexion réseau.";
            }
        });
    </script>
</body>
</html>
