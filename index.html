<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Llink OCR - Apprentissage</title>
</head>
<body style="background: #111; color: white; font-family: sans-serif; padding: 20px;">

    <h2>1. La Structure (HTML)</h2>
    <input type="file" id="selecteurFichier" accept="image/*">
    <br><br>
    <button id="boutonAction" style="padding: 10px 20px; cursor: pointer;">
        SCANNER L'IMAGE
    </button>

    <hr>

    <h2>2. État du système</h2>
    <div id="statut" style="color: gold;">Prêt. Sélectionnez une image.</div>

    <hr>

    <h2>3. Résultat de l'IA</h2>
    <div id="resultat" style="background: #222; padding: 15px; border-left: 4px solid gold;">
        Le texte apparaîtra ici...
    </div>

    <script>
        // --- LE CERVEAU (JavaScript) ---

        // Étape A : On crée des variables pour "attraper" nos éléments HTML
        const input = document.getElementById('selecteurFichier');
        const bouton = document.getElementById('boutonAction');
        const statut = document.getElementById('statut');
        const resultat = document.getElementById('resultat');

        // Étape B : On définit la clé et l'adresse de l'IA
        const CLE_API = "hf_upEJEWLPHPyrkFjVur" + "CpJlsCvXlPNIaiZm";
        const MODELE_URL = "https://api-inference.huggingface.co/models/Salesforce/blip-image-captioning-base";

        // Étape C : On dit au bouton d'écouter le "click"
        bouton.addEventListener('click', async () => {
            
            // 1. Vérifier si un fichier est choisi
            const image = input.files[0];
            if (!image) {
                alert("Erreur : Choisis une image d'abord !");
                return;
            }

            // 2. Changer l'affichage pour montrer que ça travaille
            statut.innerText = "⏳ Connexion à l'IA en cours...";
            bouton.disabled = true; // On désactive le bouton pour éviter les doubles clics
            resultat.innerText = "...";

            try {
                // 3. L'envoi (Le Fetch)
                const reponse = await fetch(MODELE_URL, {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${CLE_API}` },
                    body: image // On envoie directement le fichier image
                });

                // 4. On transforme la réponse en JSON (format lisible)
                const donnees = await reponse.json();

                // 5. On affiche le résultat
                if (reponse.ok) {
                    statut.innerText = "✅ Succès !";
                    // BLIP renvoie un tableau [ { generated_text: "..." } ]
                    resultat.innerText = donnees[0].generated_text || "Image analysée, mais pas de texte trouvé.";
                } else {
                    statut.innerText = "❌ Erreur de l'IA";
                    resultat.innerText = "Détails : " + JSON.stringify(donnees);
                }

            } catch (erreur) {
                // 6. Gestion des crashs (ex: pas d'internet)
                statut.innerText = "❌ Crash réseau";
                resultat.innerText = "Vérifie ta connexion ou si tu es bien sur un serveur (http/https).";
                console.error(erreur);
            } finally {
                // On réactive le bouton à la fin
                bouton.disabled = false;
            }
        });
    </script>
</body>
</html>
