<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOW LAB | IA TRADUCTION</title>
    <style>
        body {
            background-color: #F9F9F9;
            padding: 20px;
            font-family: sans-serif;
            text-align: center;
        }
        main {
            background-color: white;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            padding: 15px;
            height: 150px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: orange;
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .menu {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
        }
        select {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
        }
        h2#sortie {
            margin-top: 20px;
            padding: 15px;
            background: #f1f1f1;
            border-radius: 5px;
            font-size: 1.1em;
            color: #333;
        }
        footer { margin-top: 30px; font-size: 0.8em; color: #777; }
    </style>
</head>
<body>
    <header>
        <h1>FLOW LAB</h1>
        <p>IA TRADUCTION / LANGUES AFRICAINES</p>
    </header>
    <main>
        <div class="menu">
            <select id="langue_src">
                <option value="fra_Latn">Français</option>
                <option value="swh_Latn">Swahili</option>
            </select>
            <select id="langue_trgt">
                <option value="swh_Latn">Swahili</option>
                <option value="fra_Latn">Français</option>
            </select>
        </div>
        <textarea id="entree" placeholder="Entrez votre texte ici..."></textarea>
        <button id="bouton">TRADUIRE</button>
        <h2 id="sortie">La traduction s'affichera ici...</h2>
    </main>
    <footer>
        © 2026 F-LAB IA. Déployé via GitHub Pages.
    </footer>

    <script>
  const API_TOKEN = "hf_XXXXXXXX"; // TA CLÉ ICI (vérifie qu'elle commence par hf_)
  const MODEL_URL = "https://api-inference.huggingface.co/models/facebook/nllb-200-distilled-600M";

  document.getElementById("bouton").addEventListener("click", async () => {
    const text = document.getElementById("entree").value;
    const display = document.getElementById("sortie");

    if(!text) return;
    display.innerText = "Connexion au cerveau de l'IA...";

    try {
      const response = await fetch(MODEL_URL, {
        headers: { 
          "Authorization": `Bearer ${API_TOKEN}`,
          "Content-Type": "application/json" 
        },
        method: "POST",
        body: JSON.stringify({
          inputs: text,
          parameters: { "src_lang": "fra_Latn", "tgt_lang": "swh_Latn" }
        }),
      });

      const result = await response.json();

      // LOGIQUE DE DÉTECTION
      if (response.status === 401) {
        display.innerText = "Erreur : Ton Token Hugging Face n'est pas valide.";
      } else if (response.status === 503) {
        display.innerText = "L'IA est en train de se réveiller... Réessaie dans 20 secondes.";
      } else if (result[0] && result[0].translation_text) {
        display.innerText = result[0].translation_text;
      } else {
        display.innerText = "L'IA a répondu mais n'a pas compris la question.";
        console.log(result);
      }
    } catch (error) {
      display.innerText = "Problème de réseau. Vérifie ta connexion.";
    }
  });
</script>
</body>
</html>
