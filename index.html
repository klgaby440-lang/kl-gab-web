<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOW LAB | IA TRADUCTION</title>
    <style>
        body {
            background-color: #F9F9F9;
            padding: 20px;
            font-family: sans-serif;
            text-align: center;
        }
        main {
            background-color: white;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            padding: 15px;
            height: 150px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: orange;
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .menu {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
        }
        select {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
        }
        h2#sortie {
            margin-top: 20px;
            padding: 15px;
            background: #f1f1f1;
            border-radius: 5px;
            font-size: 1.1em;
            color: #333;
        }
        footer { margin-top: 30px; font-size: 0.8em; color: #777; }
    </style>
</head>
<body>
    <header>
        <h1>FLOW LAB</h1>
        <p>IA TRADUCTION / LANGUES AFRICAINES</p>
    </header>
    <main>
        <div class="menu">
            <select id="langue_src">
                <option value="fra_Latn">Français</option>
                <option value="swh_Latn">Swahili</option>
            </select>
            <select id="langue_trgt">
                <option value="swh_Latn">Swahili</option>
                <option value="fra_Latn">Français</option>
            </select>
        </div>
        <textarea id="entree" placeholder="Entrez votre texte ici..."></textarea>
        <button id="bouton">TRADUIRE</button>
        <h2 id="sortie">La traduction s'affichera ici...</h2>
    </main>
    <footer>
        © 2026 F-LAB IA. Déployé via GitHub Pages.
    </footer>

    <script>
        const API_TOKEN = "TON_TOKEN_ICI"; // Remplace par ton token Hugging Face
        const MODEL_URL = "https://api-inference.huggingface.co/models/facebook/nllb-200-distilled-600M";

        document.getElementById("bouton").addEventListener("click", async () => {
            const text = document.getElementById("entree").value;
            const targetLang = document.getElementById("langue_trgt").value;
            const display = document.getElementById("sortie");

            if(!text) return;
            display.innerText = "Analyse en cours...";

            try {
                const response = await fetch(MODEL_URL, {
                    headers: { Authorization: `Bearer ${API_TOKEN}`, "Content-Type": "application/json" },
                    method: "POST",
                    body: JSON.stringify({
                        inputs: text,
                        parameters: { tgt_lang: targetLang }
                    }),
                });
                const result = await response.json();
                display.innerText = result[0].translation_text;
            } catch (error) {
                display.innerText = "Erreur de connexion au serveur IA.";
            }
        });
    </script>
</body>
</html>
